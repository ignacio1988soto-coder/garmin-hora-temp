name: Compilar App Garmin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generar clave de desarrollador
        run: |
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Descargar SDK de Garmin
        run: |
          mkdir -p sdk
          URL=$(curl -s https://garmin.com | jq -r '.[-1].linux')
          curl -L "$URL" -o sdk.zip
          unzip -q sdk.zip -d sdk

      - name: Compilar para epix Pro 47mm
        run: |
          mkdir -p bin
          ./sdk/bin/monkeyc -f monkey.jungle -o bin/HoraTemp.prg -y developer_key.der -d epix2pro47mm -w

      - name: Guardar archivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: HoraTemp-epixPro47mm
          path: bin/HoraTemp.prg
