name: Compilar App Garmin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar entorno Connect IQ moderno
        uses: lindell/connect-iq-action@v1
        with:
          sdk-version: '7.4.3'
          devices: 'epix2pro47mm'

      - name: Generar clave de desarrollador
        run: |
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compilar para epix Pro 47mm
        run: |
          mkdir -p bin
          monkeyc -f monkey.jungle -o bin/HoraTemp.prg -y developer_key.der -d epix2pro47mm -w

      - name: Guardar archivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: HoraTemp-epixPro47mm
          path: bin/HoraTemp.prg
